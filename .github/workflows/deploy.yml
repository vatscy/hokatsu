name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages のサブパス配信に合わせて base を切り替える。
          # リポジトリ名が hokatsu でない場合はここを変更すること。
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # クライアントに埋め込むビルド識別子。dist/version.json と
          # 突き合わせて更新バナーを表示するために使う。
          VITE_APP_VERSION: ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
